services:
  app:
    container_name: stz-travelplanner-app
    build: .
    image: stz-travelplanner:latest
    ports:
      - "0.0.0.0:4002:4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://travelplanner_app:${TRAVELPLANNER_DB_PASSWORD}@stz-shared-db:5432/stz_travelplanner
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
    networks:
      - stz-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4002/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      stz.project: "stuzzicadenti-ag"
      stz.service: "travelplanner"

networks:
  stz-net:
    external: true
