<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | TravelPlanner</title>
  <style>

      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #1b5e20; text-align: center; padding: 2rem;

    .icon { font-size: 80px; margin-bottom: 1rem; }

    a {
      display: inline-block; margin-top: 1.5rem; padding: 0.75rem 2rem;
      background: #2e7d32; color: #fff; text-decoration: none;
      border-radius: 8px; font-weight: 600; font-size: 1rem;
      transition: background 0.2s;
    }
    a:hover { background: #1b5e20; }

</head>
<body>
  <div class="icon">🧭</div>
  <h1>404</h1>
