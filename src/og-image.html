<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 30%, #a5d6a7 60%, #81c784 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #1b5e20; overflow: hidden;
  }
  .icon { font-size: 64px; margin-bottom: 16px; }
  .title { font-size: 72px; font-weight: 800; letter-spacing: -2px; color: #1b5e20; }
  .tagline { font-size: 28px; color: #2e7d32; margin-top: 12px; }
  .features { display: flex; gap: 32px; margin-top: 32px; }
  .feature { background: rgba(255,255,255,0.7); padding: 12px 24px; border-radius: 12px; font-size: 18px; color: #1b5e20; }
  .badge { background: rgba(27,94,32,0.1); color: #1b5e20; padding: 8px 20px; border-radius: 20px; font-size: 18px; margin-top: 24px; }
</style>
</head>
<body>
  <div class="icon">✈</div>
  <div class="title">TravelPlanner</div>
  <div class="tagline">Plan. Explore. Remember.</div>
  <div class="features">
    <div class="feature">🤖 AI Itineraries</div>
    <div class="feature">📸 Photo Diary</div>
    <div class="feature">🗺 Interactive Maps</div>
  </div>
  <div class="badge">AI-Powered Travel Companion</div>
</body>
</html>
